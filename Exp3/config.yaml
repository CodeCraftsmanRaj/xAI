experiment:
  name: "Experiment 3 - Partial Dependence Plot"
  random_state: 42

data:
  dataset: "breast_cancer"
  test_size: 0.2

model:
  type: "random_forest"
  n_estimators: 200
  max_depth: 8
  min_samples_split: 2
  min_samples_leaf: 1
  max_features: "sqrt"
  n_jobs: -1

pdp:
  feature: "mean radius"
  points: 50
  lower_percentile: 5
  upper_percentile: 95

paths:
  model: "models/random_forest.joblib"
  metrics: "results/metrics.json"
  pdp_data: "results/pdp.csv"
  pdp_plot: "plots/pdp.png"
  importance_plot: "plots/feature_importance.png"